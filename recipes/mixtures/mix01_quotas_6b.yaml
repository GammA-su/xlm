# Mix-01 6B availability quotas (data-only; validated by tests/test_mix01_quotas_6b.py).
#
# FINAL target = 6,000,000,000 exact XLM valid training tokens, counted by the
# frozen 32,768-token tokenizer. Per-source FINAL quotas are weight * 6B.
# FIRST-PASS headroom = 110% of FINAL (estimated usable tokens, NOT exact XLM
# tokens): acquire first-pass material, canonicalize/clean, freeze the
# tokenizer fit input, train/freeze the tokenizer, tokenize/count exact XLM
# tokens, then top up ONLY deficient sources. Never silently renormalize.
# PILOT view = 32,000,000 exact XLM tokens (weight * 32M) as a separately
# identified exposure view bound to the pilot, never the full 6B payload.
# The 2 GiB frozen-input cap is unchanged.
schema_version: 1
kind: mix01_token_quotas
quota_id: mix01_6b_v1
mixture_preset: mix01
mixture_registry: mix01_views_v2
tokenizer_vocab_size: 32768
final_valid_targets: 6000000000
first_pass_headroom_ratio: 1.1
pilot_valid_targets: 32000000
