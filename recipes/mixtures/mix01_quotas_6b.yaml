notes:
  - "FINAL quotas are exact XLM valid training tokens under the frozen tokenizer, not publisher estimates and not knowable at RAW acquisition time."
  - "FIRST-PASS quotas are 110% estimated usable headroom (~6.6B total), not permission to call 6.6B exact XLM tokens."
  - "Top up ONLY deficient sources after exact counting; a deficient source is never silently renormalized."
  - "The 32M pilot binds a separately identified 32M token-shard/exposure view with lineage to the same source/pool artifacts, never the 6B payload."
  - "Frozen-input cap unchanged: 2 GiB per shard and 2 GiB aggregate; the 6B uint16 payload (~12 GB) cannot bind the pilot."
