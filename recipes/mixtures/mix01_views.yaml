  - component_id: synth_en_explanations
    source_id: synth
    repository: PleIAs/SYNTH
    observed_revision: 0d6813a2966662c39f22f0b9af28a0c1c9f7a437
    observed_license: cc-by-4.0
    observed_configs: [default]
    adapter_id: synth_en
    upstream_selector:
      description: "English question-answer pairs with required source context."
      config_name: default
      required_fields:
        - synth_id
        - language
        - query
        - query_seed_text
        - synthetic_answer
        - seed_license
      reasoning_content: excluded
    english_only: true
    live_verified: true
    notes:
      - "Upstream holds 500 synth_001..synth_500.parquet files (observed file tree)."
      - "query_seed_text supplies the necessary source context for the answer."
      - "synthetic_reasoning is a separate upstream reasoning field present on every observed row; this treatment excludes reasoning CONTENT, not the whole row."
      - "English filtering is by the actual row language field; the source is not English-pure (a certified row carries language de, and the shard holds null language values)."
      - "Certified against 3 real pinned rows of synth_001.parquet (offline sample adapter-cert-synth01): German row policy-rejected, two English rows accepted; other shards uninspected."

