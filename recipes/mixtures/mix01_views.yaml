# Mix01 source-view registry (data-only; validated by xlm.data.sources.mix01).
#
# Each entry binds ONE mixture component id to its upstream family, the exact
# upstream subset/config observed live, the adapter that renders it, and the
# selector the pool/packing layers evaluate. Conceptual category names are NEVER
# upstream fields: `upstream_selector` records the probed field names and values.
#
# Live-discovery snapshot (metadata only, 2026-09-19; ~2.8 MiB / ~28 requests):
#   data/probe/p13_mix01_snapshot.json and data/probe/p13_mix01_configs.json
# `live_verified: false` everywhere except the three Essential-Web slices, whose
# adapter was certified against 3 real pinned rows (offline sample
# adapter-cert-essential-web01). Nothing here authorizes a production run.
schema_version: 1
kind: mix01_view_registry
registry_id: mix01_views_v1
views:
  - component_id: essential_science
    source_id: essential_web
    repository: EssentialAI/essential-web-v1.0
    observed_revision: ce4eccc7e9604667b6d7f32cb6274b8b41f3113d
    observed_license: odc-by
    observed_configs: []
    adapter_id: essential_web
    upstream_selector:
      description: "Science slice by explicit operator component selection."
      eai_taxonomy_paths:
        - eai_taxonomy.free_decimal_correspondence.primary.code
        - eai_taxonomy.document_type_v2.primary.label
      quality_paths:
        - quality_signals.fasttext.english
    english_only: true
    live_verified: true
