  - component_id: ultrax_ultrafineweb
    source_id: ultrax_ultrafineweb
    repository: openbmb/UltraX-Preview
    observed_revision: null
    observed_license: null
    observed_configs:
      - UltraX-Ultra-FineWeb
    adapter_id: ultrax_ultrafineweb
    upstream_selector:
      description: "UltraX-Ultra-FineWeb config ONLY; training text is cleaned_content verbatim, never raw_content."
      config_name: UltraX-Ultra-FineWeb
      required_fields:
        - uid
        - cleaned_content
        - source
    english_only: true
    live_verified: false
    notes:
      - "Probe target is openbmb/UltraX-Preview; the README alias openbmb/UltraX must be resolved explicitly by the operator probe, never silently chosen."
      - "observed_revision is null until the operator schema probe freezes an exact commit SHA; unpinned revisions never run."
      - "observed_license is null until the probe receipt records the published license; UltraX is derived from source corpora and users must check applicable source-dataset licenses."
      - "raw_content is never training input and is never copied into canonical output; empty cleaned_content (remove_all) is a counted policy drop, not a raw_content fallback."

  - component_id: finepdfs_en
    source_id: finepdfs_edu
    repository: HuggingFaceFW/finepdfs-edu
    observed_revision: 9cfabe2127faca99b3d5c4dc6d1fcb397399ebde
    observed_license: odc-by
    observed_configs: [eng_Latn]
    adapter_id: finepdfs_en
    upstream_selector:
      description: "eng_Latn-routed educational PDF text; Docling/PyMuPDF text-extracted rows only (extractor=docling). RolmOCR image-based OCR rows (extractor=rolmOCR) are rejected; unknown extractors fail closed."
      config_name: eng_Latn
    english_only: true
    live_verified: false
    notes:
      - "Docling/PyMuPDF text-extracted rows only; RolmOCR image-OCR rows are rejected explicitly, never relabeled."
      - "english_only states the intended downstream treatment: eng_Latn is the upstream config/routing label, not a monolingual purity guarantee. Live rows may mix languages; downstream language cleaning decides."

  - component_id: synth_en_explanations
    source_id: synth
    repository: PleIAs/SYNTH
    observed_revision: 0d6813a2966662c39f22f0b9af28a0c1c9f7a437
    observed_license: cc-by-4.0
    observed_configs: [default]
    adapter_id: synth_en
    upstream_selector:
      description: "English question-answer pairs with required source context."
      config_name: default
      required_fields:
        - synth_id
        - language
        - query
        - query_seed_text
        - synthetic_answer
        - seed_license
      reasoning_content: excluded
    english_only: true
    live_verified: true
    notes:
      - "Upstream holds 500 synth_001..synth_500.parquet files (observed file tree)."
      - "query_seed_text supplies the necessary source context for the answer."
      - "synthetic_reasoning is a separate upstream reasoning field present on every observed row; this treatment excludes reasoning CONTENT, not the whole row."
      - "English filtering is by the actual row language field; the source is not English-pure (a certified row carries language de, and the shard holds null language values)."
      - "Certified against 3 real pinned rows of synth_001.parquet (offline sample adapter-cert-synth01): German row policy-rejected, two English rows accepted; other shards uninspected."

