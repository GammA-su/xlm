# Authored offline fixture shaped like an ARC-style multiple-choice task.
# Synthetic content only; it never stands in for an official benchmark.
task: xlm_fixture_mc
dataset_path: json
dataset_kwargs:
  data_files:
    train: data/xlm_fixture_mc.json
output_type: multiple_choice
training_split: train
validation_split: train
test_split: train
doc_to_text: "Question: {{question}}\nAnswer:"
doc_to_choice: "{{choices}}"
doc_to_target: "{{answer}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
